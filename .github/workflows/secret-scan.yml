name: Secret scan

# Fail-closed secret scan: never let a tree carrying a credential ship.
# Mirrors the proven interwave-live / ObjectsWebsite / objects-portal setup.
# gitleaks-action needs a paid org licence; the CLI is MIT, so we run the
# pinned binary directly (works on forks and org repos with no secrets).
#
# Runs on GitHub-hosted ubuntu on purpose: this repository is a PUBLIC fork and
# cannot join the private-only `yoyaku-ci` runner group
# (allows_public_repositories=false), so a self-hosted job would queue forever —
# see `native_ci_exempt.openreply` in the runner SSOT. Hosted minutes are free
# for public repositories.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Secret scan FIRST and fail-closed: scan the checked-out tree (the
      # artifact about to ship), not legacy history — `--no-git` is the build
      # gate, a full-history scan is a different instrument (breach archaeology).
      - name: Scan for secrets (gitleaks, pinned)
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose --exit-code 1
